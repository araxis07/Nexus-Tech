name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_AUDIODRIVER: dummy
      SDL_VIDEODRIVER: dummy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run Ruff
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Run tests
        run: uv run pytest -q -W error

      - name: Build package artifacts
        run: uv build --out-dir /tmp/nexus-tech-dist

      - name: Verify source distribution package
        run: >
          python -c 'import glob, tarfile;
          archive = glob.glob("/tmp/nexus-tech-dist/nexus_tech-*.tar.gz")[0];
          names = set(tarfile.open(archive).getnames());
          required = ("src/nexus_tech/__init__.py", "src/nexus_tech/cli.py",
          "src/nexus_tech/beta_playtest_packet.py",
          "src/nexus_tech/simulation/beta_playtest_execution.py");
          missing = [item for item in required if not any(name.endswith(item) for name in names)];
          assert not missing, f"sdist missing required files: {missing}"'

      - name: Rebuild and install source distribution offline
        run: |
          mkdir -p /tmp/nexus-tech-sdist-source /tmp/nexus-tech-sdist-rebuild
          tar -xzf /tmp/nexus-tech-dist/nexus_tech-*.tar.gz -C /tmp/nexus-tech-sdist-source
          sdist_root="$(find /tmp/nexus-tech-sdist-source -mindepth 1 -maxdepth 1 -type d -print -quit)"
          cd "$sdist_root"
          uv run --offline --no-project --with 'hatchling>=1.27.0' \
            python -m hatchling build --target wheel --directory /tmp/nexus-tech-sdist-rebuild
          uv venv /tmp/nexus-tech-sdist-smoke
          uv pip install --offline --python /tmp/nexus-tech-sdist-smoke/bin/python \
            --no-deps /tmp/nexus-tech-sdist-rebuild/nexus_tech-*.whl
          cd /tmp
          /tmp/nexus-tech-sdist-smoke/bin/python -c \
            'from importlib.metadata import version; import nexus_tech; assert nexus_tech.__version__ == version("nexus-tech")'

      - name: Smoke test installed wheel
        run: |
          uv venv /tmp/nexus-tech-wheel-smoke
          uv pip install --python /tmp/nexus-tech-wheel-smoke/bin/python /tmp/nexus-tech-dist/nexus_tech-*.whl
          cd /tmp
          /tmp/nexus-tech-wheel-smoke/bin/nexus-tech --version
          /tmp/nexus-tech-wheel-smoke/bin/nexus-tech validate-content
          /tmp/nexus-tech-wheel-smoke/bin/nexus-tech doctor --db-path /tmp/nexus-tech-wheel-smoke.db
          /tmp/nexus-tech-wheel-smoke/bin/nexus-tech play-2d --scenario founder_journey --seed 7 --headless --max-frames 2 --motion-mode reduced --db-path /tmp/nexus-tech-wheel-smoke.db
          /tmp/nexus-tech-wheel-smoke/bin/nexus-tech check-saves --db-path /tmp/nexus-tech-wheel-smoke.db

      - name: Validate content catalog
        run: uv run nexus-tech validate-content

      - name: Run gameplay convergence gate
        run: uv run pytest -q tests/test_gameplay_convergence.py

      - name: Run UX clarity gate
        run: uv run pytest -q tests/test_ux_clarity.py

      - name: Run beta convergence gate
        run: uv run pytest -q tests/test_beta_convergence.py

      - name: Check beta archive evidence guardrail
        run: uv run nexus-tech beta-evidence --db-path /tmp/nexus-tech-beta-evidence.db

      - name: Check structured human beta evidence guardrail
        run: uv run nexus-tech beta-playtest-status --db-path /tmp/nexus-tech-human-beta.db

      - name: Export structured human beta execution plan
        run: >
          uv run nexus-tech beta-playtest-plan
          --command-prefix "uv run nexus-tech"
          --db-path /tmp/nexus-tech-human-beta.db
          --packet-output /tmp/nexus-tech-beta-playtest-next.md
          --output /tmp/nexus-tech-beta-playtest-plan.md

      - name: Prepare structured human beta next-session packet
        run: >
          uv run nexus-tech prepare-beta-playtest-session
          --command-prefix "uv run nexus-tech"
          --db-path /tmp/nexus-tech-human-beta.db
          --output /tmp/nexus-tech-beta-playtest-next.md

      - name: Validate structured human beta next-session packet
        run: >
          uv run nexus-tech validate-beta-playtest-session-packet
          --input /tmp/nexus-tech-beta-playtest-next.md
          --db-path /tmp/nexus-tech-human-beta.db

      - name: Check featured campaign branch readiness
        run: >
          uv run nexus-tech campaign-readiness
          --runs 3
          --turns 20
          --seed-base 28500
          --output /tmp/nexus-tech-campaign-readiness.md

      - name: Check deterministic decision variety
        run: >
          uv run nexus-tech decision-quality-audit
          --runs 3
          --turns 12
          --seed-base 28600
          --output /tmp/nexus-tech-decision-quality.md

      - name: Smoke-test accessible 2D launch profile
        run: >
          uv run nexus-tech play-2d
          --scenario founder_journey
          --seed 283
          --headless
          --max-frames 2
          --window-size 820x620
          --motion-mode reduced
          --ui-scale large
          --contrast-mode high
          --db-path /tmp/nexus-tech-accessibility-smoke.db

      - name: Run onboarding flow audit
        run: uv run nexus-tech audit-onboarding-flow --output /tmp/nexus-tech-onboarding-flow-audit.md

      - name: Prepare onboarding visible playtest packet
        run: >
          uv run nexus-tech onboarding-visible-playtest-packet
          --command-prefix "uv run nexus-tech"
          --output /tmp/nexus-tech-onboarding-visible-playtest.md

      - name: Validate onboarding visible playtest packet
        run: >
          uv run nexus-tech validate-onboarding-visible-playtest-packet
          --command-prefix "uv run nexus-tech"
          --input /tmp/nexus-tech-onboarding-visible-playtest.md

      - name: Prepare onboarding visible playtest report
        run: >
          uv run nexus-tech onboarding-visible-playtest-report
          --command-prefix "uv run nexus-tech"
          --input /tmp/nexus-tech-onboarding-visible-playtest.md
          --output /tmp/nexus-tech-onboarding-visible-playtest-report.md

      - name: Validate onboarding visible playtest report
        run: >
          uv run nexus-tech validate-onboarding-visible-playtest-report
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md

      - name: Check onboarding visible playtest status
        run: >
          uv run nexus-tech onboarding-visible-playtest-status
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md

      - name: Prepare onboarding visible next-step handoff
        run: >
          uv run nexus-tech onboarding-visible-playtest-next
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --output /tmp/nexus-tech-onboarding-visible-playtest-next.md

      - name: Validate onboarding visible next-step handoff
        run: >
          uv run nexus-tech validate-onboarding-visible-playtest-next
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --input /tmp/nexus-tech-onboarding-visible-playtest-next.md

      - name: Prepare onboarding visible focused batch packet
        run: >
          uv run nexus-tech onboarding-visible-playtest-batch-packet
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --output /tmp/nexus-tech-onboarding-visible-playtest-batch-packet.md

      - name: Validate onboarding visible focused batch packet
        run: >
          uv run nexus-tech validate-onboarding-visible-playtest-batch-packet
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --input /tmp/nexus-tech-onboarding-visible-playtest-batch-packet.md

      - name: Run onboarding visible focused batch preflight
        run: >
          uv run nexus-tech onboarding-visible-playtest-batch-preflight
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --batch-size 6
          --frames 1
          --db-path /tmp/nexus-tech-onboarding-visible-batch-preflight.db
          --output /tmp/nexus-tech-onboarding-visible-batch-preflight.md

      - name: Prepare onboarding visible terminal batch handoff
        run: >
          uv run nexus-tech onboarding-visible-terminal-batch
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --output /tmp/nexus-tech-onboarding-visible-terminal-batch.md

      - name: Validate onboarding visible terminal batch handoff
        run: >
          uv run nexus-tech validate-onboarding-visible-terminal-batch
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --input /tmp/nexus-tech-onboarding-visible-terminal-batch.md

      - name: Prepare onboarding visible terminal evidence sheet
        run: >
          uv run nexus-tech onboarding-visible-terminal-evidence-sheet
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --output /tmp/nexus-tech-onboarding-visible-terminal-evidence-sheet.md

      - name: Validate onboarding visible terminal evidence sheet
        run: >
          uv run nexus-tech validate-onboarding-visible-terminal-evidence-sheet
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --input /tmp/nexus-tech-onboarding-visible-terminal-evidence-sheet.md

      - name: Prepare onboarding visible 820x620 evidence sheet
        run: >
          uv run nexus-tech onboarding-visible-window-evidence-sheet
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --window 820x620
          --output /tmp/nexus-tech-onboarding-visible-820x620-evidence-sheet.md

      - name: Validate onboarding visible 820x620 evidence sheet
        run: >
          uv run nexus-tech validate-onboarding-visible-window-evidence-sheet
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --window 820x620
          --input /tmp/nexus-tech-onboarding-visible-820x620-evidence-sheet.md

      - name: Prepare onboarding visible 1280x720 evidence sheet
        run: >
          uv run nexus-tech onboarding-visible-window-evidence-sheet
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --window 1280x720
          --output /tmp/nexus-tech-onboarding-visible-1280x720-evidence-sheet.md

      - name: Validate onboarding visible 1280x720 evidence sheet
        run: >
          uv run nexus-tech validate-onboarding-visible-window-evidence-sheet
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --window 1280x720
          --input /tmp/nexus-tech-onboarding-visible-1280x720-evidence-sheet.md

      - name: Prepare onboarding visible 1440x900 evidence sheet
        run: >
          uv run nexus-tech onboarding-visible-window-evidence-sheet
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --window 1440x900
          --output /tmp/nexus-tech-onboarding-visible-1440x900-evidence-sheet.md

      - name: Validate onboarding visible 1440x900 evidence sheet
        run: >
          uv run nexus-tech validate-onboarding-visible-window-evidence-sheet
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --window 1440x900
          --input /tmp/nexus-tech-onboarding-visible-1440x900-evidence-sheet.md

      - name: Prepare onboarding visible evidence matrix
        run: >
          uv run nexus-tech onboarding-visible-evidence-matrix
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --output /tmp/nexus-tech-onboarding-visible-evidence-matrix.md

      - name: Validate onboarding visible evidence matrix
        run: >
          uv run nexus-tech validate-onboarding-visible-evidence-matrix
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --input /tmp/nexus-tech-onboarding-visible-evidence-matrix.md

      - name: Run onboarding visible window preflight
        run: >
          uv run nexus-tech onboarding-visible-window-preflight
          --command-prefix "uv run nexus-tech"
          --frames 1
          --db-path /tmp/nexus-tech-onboarding-visible-window-preflight.db
          --output /tmp/nexus-tech-onboarding-visible-window-preflight.md

      - name: Prepare onboarding visible manual session
        run: >
          uv run nexus-tech onboarding-visible-manual-session
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --output /tmp/nexus-tech-onboarding-visible-manual-session.md

      - name: Validate onboarding visible manual session
        run: >
          uv run nexus-tech validate-onboarding-visible-manual-session
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --input /tmp/nexus-tech-onboarding-visible-manual-session.md

      - name: Prepare onboarding visible UX issue intake
        run: >
          uv run nexus-tech onboarding-visible-ux-issue-intake
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --output /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md

      - name: Validate onboarding visible UX issue intake
        run: >
          uv run nexus-tech validate-onboarding-visible-ux-issue-intake
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --input /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md

      - name: Prepare onboarding visible UX fix plan
        run: >
          uv run nexus-tech onboarding-visible-ux-fix-plan
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --input /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --output /tmp/nexus-tech-onboarding-visible-ux-fix-plan.md

      - name: Validate onboarding visible UX fix plan
        run: >
          uv run nexus-tech validate-onboarding-visible-ux-fix-plan
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --intake /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --input /tmp/nexus-tech-onboarding-visible-ux-fix-plan.md

      - name: Prepare onboarding visible UX triage sprint
        run: >
          uv run nexus-tech onboarding-visible-ux-triage-sprint
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --intake /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --plan /tmp/nexus-tech-onboarding-visible-ux-fix-plan.md
          --output /tmp/nexus-tech-onboarding-visible-ux-triage-sprint.md

      - name: Validate onboarding visible UX triage sprint
        run: >
          uv run nexus-tech validate-onboarding-visible-ux-triage-sprint
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --intake /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --plan /tmp/nexus-tech-onboarding-visible-ux-fix-plan.md
          --input /tmp/nexus-tech-onboarding-visible-ux-triage-sprint.md

      - name: Prepare onboarding visible UX triage next step
        run: >
          uv run nexus-tech onboarding-visible-ux-triage-next
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --intake /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --plan /tmp/nexus-tech-onboarding-visible-ux-fix-plan.md
          --sprint /tmp/nexus-tech-onboarding-visible-ux-triage-sprint.md
          --output /tmp/nexus-tech-onboarding-visible-ux-triage-next.md

      - name: Validate onboarding visible UX triage next step
        run: >
          uv run nexus-tech validate-onboarding-visible-ux-triage-next
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --intake /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --plan /tmp/nexus-tech-onboarding-visible-ux-fix-plan.md
          --sprint /tmp/nexus-tech-onboarding-visible-ux-triage-sprint.md
          --input /tmp/nexus-tech-onboarding-visible-ux-triage-next.md

      - name: Prepare onboarding visible UX recording queue
        run: >
          uv run nexus-tech onboarding-visible-ux-recording-queue
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --intake /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --plan /tmp/nexus-tech-onboarding-visible-ux-fix-plan.md
          --sprint /tmp/nexus-tech-onboarding-visible-ux-triage-sprint.md
          --output /tmp/nexus-tech-onboarding-visible-ux-recording-queue.md

      - name: Validate onboarding visible UX recording queue
        run: >
          uv run nexus-tech validate-onboarding-visible-ux-recording-queue
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --intake /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --plan /tmp/nexus-tech-onboarding-visible-ux-fix-plan.md
          --sprint /tmp/nexus-tech-onboarding-visible-ux-triage-sprint.md
          --input /tmp/nexus-tech-onboarding-visible-ux-recording-queue.md

      - name: Prepare onboarding visible UX progress board
        run: >
          uv run nexus-tech onboarding-visible-ux-progress
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --intake /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --plan /tmp/nexus-tech-onboarding-visible-ux-fix-plan.md
          --sprint /tmp/nexus-tech-onboarding-visible-ux-triage-sprint.md
          --queue /tmp/nexus-tech-onboarding-visible-ux-recording-queue.md
          --output /tmp/nexus-tech-onboarding-visible-ux-progress.md

      - name: Validate onboarding visible UX progress board
        run: >
          uv run nexus-tech validate-onboarding-visible-ux-progress
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --intake /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --plan /tmp/nexus-tech-onboarding-visible-ux-fix-plan.md
          --sprint /tmp/nexus-tech-onboarding-visible-ux-triage-sprint.md
          --queue /tmp/nexus-tech-onboarding-visible-ux-recording-queue.md
          --input /tmp/nexus-tech-onboarding-visible-ux-progress.md

      - name: Prepare onboarding visible UX batch packet
        run: >
          uv run nexus-tech onboarding-visible-ux-batch-packet
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --intake /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --plan /tmp/nexus-tech-onboarding-visible-ux-fix-plan.md
          --sprint /tmp/nexus-tech-onboarding-visible-ux-triage-sprint.md
          --queue /tmp/nexus-tech-onboarding-visible-ux-recording-queue.md
          --batch-size 3
          --output /tmp/nexus-tech-onboarding-visible-ux-batch-packet.md

      - name: Validate onboarding visible UX batch packet
        run: >
          uv run nexus-tech validate-onboarding-visible-ux-batch-packet
          --command-prefix "uv run nexus-tech"
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --intake /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --plan /tmp/nexus-tech-onboarding-visible-ux-fix-plan.md
          --sprint /tmp/nexus-tech-onboarding-visible-ux-triage-sprint.md
          --queue /tmp/nexus-tech-onboarding-visible-ux-recording-queue.md
          --batch-size 3
          --input /tmp/nexus-tech-onboarding-visible-ux-batch-packet.md

      - name: Prepare onboarding visible UX batch closeout
        run: >
          uv run nexus-tech onboarding-visible-ux-batch-closeout
          --command-prefix "uv run nexus-tech"
          --batch /tmp/nexus-tech-onboarding-visible-ux-batch-packet.md
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --intake /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --output /tmp/nexus-tech-onboarding-visible-ux-batch-closeout.md

      - name: Validate onboarding visible UX batch closeout
        run: >
          uv run nexus-tech validate-onboarding-visible-ux-batch-closeout
          --command-prefix "uv run nexus-tech"
          --batch /tmp/nexus-tech-onboarding-visible-ux-batch-packet.md
          --report /tmp/nexus-tech-onboarding-visible-playtest-report.md
          --intake /tmp/nexus-tech-onboarding-visible-ux-issue-intake.md
          --input /tmp/nexus-tech-onboarding-visible-ux-batch-closeout.md

      - name: Check runtime version and doctor
        run: |
          uv run nexus-tech --version
          uv run nexus-tech doctor

      - name: Smoke test 2D headless launchers
        run: |
          uv run nexus-tech play-2d --scenario founder_journey --seed 7 --headless --max-frames 2 --motion-mode reduced
          uv run nexus-tech menu-2d --headless --max-frames 2 --motion-mode reduced

      - name: Run 2D motion audit gates
        run: |
          uv run nexus-tech audit-2d-motion --scenario founder_journey --seed 7 --frames 2
          uv run nexus-tech audit-2d-motion --scenario founder_journey --seed 7 --frames 1 --motion-mode reduced
          uv run nexus-tech audit-2d-motion --scenario founder_journey --seed 7 --frames 1 --motion-mode off

      - name: Run 2D visual and animation audit gates
        run: |
          uv run nexus-tech audit-2d-visual --scenario founder_journey --seed 7 --output-dir /tmp/nexus-tech-visual-audit/full
          uv run nexus-tech audit-2d-visual --scenario founder_journey --seed 7 --motion-mode off --output-dir /tmp/nexus-tech-visual-audit/off
          uv run nexus-tech audit-2d-animation --scenario founder_journey --seed 7 --frames 1

      - name: Run 2D layout matrix gate
        run: >
          uv run nexus-tech audit-2d-layout-matrix
          --scenario founder_journey
          --seed 7
          --viewport 820x620
          --viewport 1280x720
          --output /tmp/nexus-tech-2d-layout-matrix.md

      - name: Run 2D animation matrix audit
        run: uv run nexus-tech audit-2d-animation-matrix --frames 1 --output /tmp/nexus-tech-animation-matrix.md

      - name: Prepare 2D animation playtest report
        run: >
          uv run nexus-tech prepare-2d-animation-playtest
          --matrix-input /tmp/nexus-tech-animation-matrix.md
          --output /tmp/nexus-tech-animation-playtest-prep.md

      - name: Run 820x620 animation batch preflight
        run: >
          uv run nexus-tech animation-playtest-batch-preflight
          --command-prefix "uv run nexus-tech"
          --output /tmp/nexus-tech-animation-batch-820x620-preflight.md

      - name: Prepare manual animation QA session artifacts
        run: |
          uv run nexus-tech prepare-animation-playtest-session \
            --auto-commit \
            --prefill-automated-gates \
            --command-prefix "uv run nexus-tech" \
            --report-output /tmp/nexus-tech-animation-playtest-report.md \
            --commands-output /tmp/nexus-tech-animation-playtest-commands.md \
            --plan-output /tmp/nexus-tech-animation-playtest-plan.md \
            --recorder-output /tmp/nexus-tech-animation-recorder-queue.md \
            --route-batches-output /tmp/nexus-tech-animation-route-batches.md \
            --next-batch-output /tmp/nexus-tech-animation-next-batch.md \
            --triage-output /tmp/nexus-tech-animation-ui-triage.md \
