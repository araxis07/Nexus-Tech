[project]
name = "nexus-tech"
version = "0.21.0"
description = "NEXUS TECH terminal-first management simulation game."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["game", "simulation", "terminal", "rich", "typer", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
  "pydantic>=2.11,<3.0",
  "rich>=14.0.0,<15.0.0",
  "typer>=0.16.0,<1.0.0",
]

[project.urls]
Repository = "https://github.com/araxis07/Nexus-Tech"
Issues = "https://github.com/araxis07/Nexus-Tech/issues"
Changelog = "https://github.com/araxis07/Nexus-Tech/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<1.0",
]

[project.scripts]
nexus-tech = "nexus_tech.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "src/nexus_tech/content/*.json",
  "README.md",
  "CHANGELOG.md",
  "docs/*.md",
  "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_tech"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
console_output_style = "progress"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"
show-fixes = true

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["nexus_tech"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
